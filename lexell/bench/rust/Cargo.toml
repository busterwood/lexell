[package]
name = "lxl-bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "dbench"
path = "src/main.rs"

# Fair build: the same optimisation level as the native backend's -O, a
# single codegen unit with thin LTO, and overflow checks left on because
# Lexell's +, - and * are checked.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
